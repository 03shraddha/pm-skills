# Competitor Analysis

## Purpose

Conduct a comprehensive competitive analysis to understand the landscape, identify 5 direct competitors, and uncover differentiation opportunities. This skill maps competitive positioning, synthesizes competitor strengths and weaknesses, and highlights opportunities for strategic differentiation.

## Instructions

You are a strategic product analyst and competitive intelligence expert specializing in competitive positioning and market landscape mapping.

## Input

Your task is to analyze the competitive landscape for $ARGUMENTS in the [market/industry segment] (if specified).

Conduct web research to identify direct competitors. If the user provides market research, competitor data, pricing sheets, feature comparisons, or customer feedback about competitors, read and analyze them directly. Synthesize data into a comprehensive competitive view.

## Analysis Steps (Think Step by Step)

1. **Market Scoping**: Define the market, industry, and addressable customer base for $ARGUMENTS
2. **Competitor Identification**: Use web search to identify 5 primary direct competitors
3. **Competitive Intelligence**: Research each competitor's positioning, features, pricing, go-to-market strategy
4. **Strengths & Weaknesses**: Assess competitor capabilities, limitations, and market positioning
5. **Differentiation Mapping**: Identify gaps, overlaps, and opportunities for $ARGUMENTS to differentiate
6. **Strategic Synthesis**: Develop insights about competitive dynamics and future threats

## Output Structure

### Market Overview & Definition
- Market size and growth trends
- Primary customer segments and use cases
- Key success factors in this market
- Market dynamics and competitive intensity

### Competitive Set Summary
- 5 primary direct competitors identified
- Market positions: leaders, challengers, niche players
- Estimated market share or positioning
- Notable adjacent or indirect competitors

### For Each of the 5 Competitors

**Competitor Profile**
- Company name, founding date, funding/status
- Primary market focus and customer segments served
- Estimated market share or customer base size
- Market positioning and go-to-market strategy

**Core Product Strengths**
- Key features and capabilities
- Unique competitive advantages
- Customer value proposition
- Technology differentiation or moats
- Customer satisfaction and retention signals

**Product Weaknesses & Gaps**
- Missing features or use cases
- Known limitations or pain points for customers
- Technical or operational weaknesses
- Market positioning gaps
- Customer dissatisfaction areas

**Business Model & Pricing**
- Pricing structure (per-seat, per-usage, flat-fee, freemium, etc.)
- Price point(s) in market
- Go-to-market channels and sales motion
- Revenue model and growth stage

**Competitive Threats & Advantages**
- How this competitor threatens $ARGUMENTS
- Existing customer base and switching costs
- Strategic partnerships or ecosystems
- Recent product updates or strategic moves

### Differentiation Opportunities for $ARGUMENTS
- Unmet customer needs across competitive set
- Feature/pricing/UX opportunities to stand out
- Target segments underserved by competitors
- Jobs-to-be-done not effectively solved by competitors
- Channel or go-to-market approaches not yet deployed
- Potential partnerships or integrations competitors lack

### Competitive Positioning Recommendation
- Recommended competitive positioning for $ARGUMENTS
- Key differentiators to emphasize
- Segments or use cases to target or avoid
- Competitive threats to monitor
- 12-18 month competitive risks and opportunities

## Best Practices

- Research current competitor websites, pricing pages, and customer reviews
- Use web search to identify product launches, funding, executive moves
- Distinguish between direct competitors and adjacent alternatives
- Validate competitive insights across multiple sources
- Identify both obvious and subtle differentiation opportunities
- Consider customer pain points not yet addressed in market
- Look for emerging competitors or new market entrants
- Flag competitors gaining traction or gaining market share
- Consider long-term competitive dynamics and market shifts

<script type="text/markdown" id="md-brainstorm">
# PM Brainstorm

> **What it does:** Generates diverse product ideas or experiment designs using multi-perspective ideation and lean startup thinking.
> **Input:** A product name or concept, plus mode (ideas or experiments) and stage (existing or new product).
> **Output:** A structured list of ideas or experiments with rationale, ranked by impact/effort, plus one recommended next step.

---

## Frameworks Used

This skill draws on:
- **Jobs-to-be-Done** (Christensen) — generate ideas by asking "what job is the customer hiring this product to do?" across functional, emotional, and social dimensions
- **Lean Startup** (Eric Ries) — design the smallest possible experiment that tests a leap-of-faith assumption
- **Working Backwards** (Amazon) — before brainstorming solutions, write the press release for the finished product to clarify the customer need
- **Continuous Discovery Habits** (Teresa Torres) — treat brainstorming as opportunity-finding first, solution-finding second

In 2026, AI PMs use AI to synthesize customer signals (support tickets, reviews, interviews) before brainstorming, so ideas are grounded in real unmet needs rather than internal intuition.

---

## Input

$ARGUMENTS should specify:
- **What**: product name or concept
- **Mode**: ideas (brainstorm features/directions) or experiments (design tests for a specific idea)
- **Stage**: existing product or new product

If mode is not specified, default to ideas. Infer stage from context.

---

## Brainstorming Ideas

### Existing Product
Before generating ideas, identify the job the product is currently hired to do. Then generate ideas from three lenses:

**PM lens** — Unmet jobs-to-be-done, metrics to move, adjacent use cases, underserved segments
**Designer lens** — UX friction, emotional job failures, missing delight moments, broken flows
**Engineer lens** — Underutilized technical capabilities, high-value low-cost builds, API opportunities

Output: 5-7 ideas per lens with one-line rationale. Synthesize: top 5 ranked by impact/effort, with the reasoning.

### New Product
Use early discovery framing — avoid over-specifying solutions. For each direction:
- Target user and their core job-to-be-done (functional + emotional + social)
- 5-7 distinct product directions (not just feature variations)
- For each: the core value prop, the riskiest assumption, and the minimum version to test
- Apply Working Backwards: draft a one-sentence press release for each direction — if it's hard to write, the idea probably won't work

---

## Designing Experiments

### Existing Product
Validate a specific feature idea before building. Apply Lean Startup thinking:
- State the hypothesis: "If we build X, we expect Y, because Z"
- Identify the leap-of-faith assumption (what must be true for this to work?)
- Design 3 experiments: quantitative signal, qualitative signal, fake-door or concierge test
- Define success metrics and timeline for each
- Recommend the cheapest test that could invalidate the riskiest assumption

### New Product (Pretotypes)
- Identify the leap-of-faith assumption (demand, behavior, or willingness-to-pay)
- Design the smallest possible test: landing page, wizard-of-oz, paper prototype, smoke test
- In 2026: use AI-assisted prototyping (vibe coding with tools like Claude Code) to generate working HTML prototypes in minutes instead of hours
- Define what "validated" looks like before running the test
- Suggest channels to recruit participants

---

## Output Format

1. Brief restatement of the problem or opportunity
2. Ideas or experiments (structured per mode above)
3. Recommended next step — one specific action to take this week

<script type="text/markdown" id="md-assumptions">
# PM Assumption Mapping

> **What it does:** Surfaces and prioritizes the assumptions that could kill a product idea before any code is written.
> **Input:** A feature idea or product concept, plus whether it is for an existing or new product.
> **Output:** A full assumption map by category, a prioritized top 5-7 by Impact x Evidence, and one recommended experiment per priority assumption.

---

## Frameworks Used

- **Inspired** (Marty Cagan) — the VUVF model: Value, Usability, Viability, Feasibility risk categories
- **Jobs-to-be-Done / Competing Against Luck** (Christensen) — surface assumptions across functional, emotional, and social job dimensions
- **Lean Startup** (Eric Ries) — leap-of-faith assumptions: identify what must be true for the business to work, then test the riskiest one first
- **Continuous Discovery Habits** (Teresa Torres) — assumptions are branches on the Opportunity Solution Tree; test before building

In 2026, AI PMs use AI to cross-reference assumptions against customer review data, support tickets, and behavioral analytics before scoring — reducing gut-feel bias in the prioritization.

---

## Input

$ARGUMENTS should specify:
- The feature idea or product concept to stress-test
- Whether it is for an **existing product** or a **new product**

---

## Identifying Assumptions

### Existing Product
Map assumptions across the VUVF framework (Marty Cagan, Inspired):

| Category | Question to ask |
|---|---|
| **Value** | Do users actually want this? Will it solve a real problem in a way they care about? |
| **Usability** | Can users understand and use it without friction or support? |
| **Viability** | Does this make business sense? Will the unit economics work? |
| **Feasibility** | Can the team build this with available resources, data, and tech stack? |

Generate 4-6 assumptions per category. Write each as a falsifiable statement: "We believe that [assumption]."

### New Product
Map assumptions across 8 risk categories:

1. **Desirability** — Do enough people have this problem and care about solving it?
2. **Value** — Does our solution solve it better than current alternatives (including doing nothing)?
3. **Usability** — Will people understand how to use it without hand-holding?
4. **Feasibility** — Can we build it with the team and tech we have?
5. **Viability** — Can we build a sustainable business model around it?
6. **Go-to-Market** — Can we reach, acquire, and retain the target customer at viable cost?
7. **Strategy** — Can we defend this position over time? Is there a moat?
8. **Team** — Do we have the capabilities, focus, and resources to execute?

Generate 3-5 assumptions per category. Apply Lean Startup thinking: identify the leap-of-faith assumption for each — the one assumption that, if wrong, kills the entire idea.

---

## Prioritizing Assumptions

Score each assumption on two axes:

- **Impact** (1-5): If this assumption is wrong, how badly does it break the idea?
- **Evidence** (1-5): How much existing evidence supports it being true? (1 = none, 5 = strong)

**Priority = High Impact + Low Evidence.** These are the assumptions to test first — high stakes, low confidence.

Highlight the top 5-7. Flag any that are both high-impact and have conflicting evidence — these need qualitative research, not just A/B tests.

---

## Output Format

1. Full assumption map by category in table format
2. Top 5-7 prioritized assumptions with Impact and Evidence scores
3. For each priority assumption: one experiment to test it (type, method, success criteria)
4. Recommended discovery sprint focus — which assumption to tackle first and why
5. Leap-of-faith call: the single assumption that, if wrong, invalidates the entire initiative
</script>

<script type="text/markdown" id="md-features">
# PM Feature Prioritization

> **What it does:** Turns a messy list of feature requests or backlog items into a scored, defensible prioritization recommendation.
> **Input:** A list of feature requests or backlog items, plus optional strategic goals/OKRs and team capacity.
> **Output:** Themed backlog with RICE scores, Quick Wins / Big Bets segmentation, top 3 build recommendations, and an explicit "what not to build" list.

---

## Frameworks Used

- **RICE Scoring** (Intercom) — Reach x Impact x Confidence / Effort: the standard for quantitative, defensible prioritization
- **ICE Scoring** (Sean Ellis) — faster alternative for rapid triage of many small items when precision is less critical
- **Kano Model** (Noriaki Kano) — categorize features as Must-Haves (ship now), Performance (improve over time), or Delighters (differentiation); what delights today becomes table stakes tomorrow
- **Shape Up** (Basecamp) — treat prioritization as a betting decision with a fixed appetite, not a backlog to clear
- **Jobs-to-be-Done** — group requests by the underlying customer job, not the surface feature request

In 2026, AI PMs use AI to pre-cluster and pre-score feature requests automatically, then review and debate the output — shifting the PM's role from data entry to strategic judgment.

---

## Input

$ARGUMENTS should provide:
- A list of feature requests or backlog items (paste directly or describe them)
- Optional: strategic goals or OKRs to align against
- Optional: team size or capacity constraints

---

## Analysis Steps

### 1. Theme Grouping
Cluster all requests into 3-6 themes using JTBD framing. Name each theme by the customer job it addresses, not the feature:
- "Faster onboarding" not "Onboarding redesign"
- "Reduce churn from power users" not "Advanced features"

Flag requests that don't map to any strategic goal — these are candidates to cut.

### 2. Kano Classification
Before scoring, classify each item:
- **Must-Have** — customers are angry if absent; ship in next sprint
- **Performance** — satisfaction scales with quality; invest proportionally
- **Delighter** — unexpected, creates competitive differentiation; these are your bets

Must-Haves have no upside from over-engineering. Delighters are where you win.

### 3. RICE Scoring
Score every feature on four dimensions (1-5 or estimated numbers):

| Dimension | What to assess |
|---|---|
| **Reach** | How many users affected per month? |
| **Impact** | How much does this move the needle? (0.25 / 0.5 / 1 / 2 / 3) |
| **Confidence** | How certain are the estimates? (low = 50%, medium = 80%, high = 100%) |
| **Effort** | Person-months to ship (lower = better) |

**RICE Score = (Reach x Impact x Confidence) / Effort**

Use ICE (Impact x Confidence x Ease, all 1-10) for quick triage of small items where RICE would be overkill.

### 4. Segmentation Matrix
Classify using impact vs. effort:
- **Quick Wins** — high impact, low effort: ship now
- **Big Bets** — high impact, high effort: plan carefully, consider phasing
- **Fill-ins** — low impact, low effort: ship when there's slack capacity
- **Deprioritize** — low impact, high effort: cut or defer indefinitely

Apply Shape Up thinking to Big Bets: set a fixed appetite (e.g., 6 weeks max) and scope the solution to fit — don't let it expand.

### 5. Risk Flags
Surface any items with:
- High demand but low strategic alignment (stakeholder pressure vs. actual value)
- High effort with unvalidated assumptions (build trap risk — needs discovery first)
- Dependencies that unlock multiple other items (do these first)

---

## Output Format

1. Theme summary with request count per theme
2. Kano classification for all items
3. Prioritized backlog sorted by RICE score (table format)
4. Segmentation matrix: Quick Wins / Big Bets / Fill-ins / Deprioritize
5. Top 3 build recommendations with rationale
6. Explicit "do not build" list with reasons — critical for stakeholder alignment
</script>

<script type="text/markdown" id="md-research">
# PM Customer Research

> **What it does:** Prepares structured customer interview scripts or synthesizes completed transcripts into PM-ready insight summaries.
> **Input:** Mode (script or summarize), plus a product area/hypothesis (for scripts) or a transcript (for synthesis).
> **Output:** A complete interview guide with JTBD questions (script mode), or a structured insight summary with pain points, opportunity signals, and action items (summarize mode).

---

## Frameworks Used

- **Jobs-to-be-Done** (Christensen / Competing Against Luck) — probe for functional, emotional, and social job dimensions; the best interviews reveal why, not just what
- **Continuous Discovery Habits** (Teresa Torres) — weekly 30-minute interviews with 2-3 customers is sustainable; treat every interview as opportunity-finding, not solution validation
- **Working Backwards** (Amazon) — after synthesis, ask: "Could we write a press release for a product that solves what we just heard?" If yes, there's a real opportunity
- **Opportunity-Solution Tree** (Torres) — map interview findings directly to opportunity branches on the tree; insights without a home in the tree are noise

In 2026, AI PMs use AI to synthesize patterns across multiple transcripts simultaneously — surfacing the top 5 themes across 20 interviews in minutes. Use this skill for single-interview depth; use AI batch synthesis for cross-interview pattern detection.

---

## Input

$ARGUMENTS should specify:
- **Mode**: script (create an interview guide) or summarize (synthesize a transcript)
- For script mode: the product area, hypothesis, or specific assumption to explore
- For summarize mode: paste the transcript or describe the key topics covered

If mode is unclear, infer from whether a transcript is provided.

---

## Script Mode

Create a structured 45-60 minute interview guide:

### Warm-up (5 min)
- Role, context, and day-to-day background
- "Walk me through a typical [relevant work day / task]"
- Goal: establish rapport; do not mention the product or solution yet

### Current Behavior Exploration (15 min)
- "Walk me through the last time you had to [relevant task]..."
- "What does your current process look like from start to finish?"
- "What tools, workarounds, or hacks are you using?"
- Probe: frequency, frustration level, cost of the workaround, what triggers the task

### JTBD Deep Dive (20 min)
Jobs-to-be-done questions surface the underlying motivation, not the surface request:
- "What were you ultimately trying to accomplish when you [did X]?"
- "How did it make you feel when [pain point] happened?"
- "How do others on your team / your manager perceive this process?"
- "If this problem disappeared tomorrow, what would change for you?"
- "What would the perfect version of this look like?"

Probe all three job dimensions: functional (task), emotional (feeling), social (perception).

### Solution Probing (10 min — only if validating a specific hypothesis)
- Describe the concept or show a prototype — do not lead with a demo
- "Does this solve the problem you described? Why or why not?"
- "What's missing? What would you remove?"
- Listen for hesitation as much as enthusiasm — both are signal

### Wrap-up (5 min)
- "Is there anything I didn't ask that you think I should know?"
- "Who else on your team or network deals with this problem?"
- Ask for referrals to 2-3 other potential participants

---

## Summarize Mode

Analyze the transcript and produce a structured summary:

### Participant Snapshot
- Role, company type, team size, how they currently solve the problem

### Jobs-to-be-Done
- **Primary job**: what they were fundamentally trying to accomplish
- **Emotional job**: how they want to feel while doing it
- **Social job**: how they want to be perceived by others

### Satisfaction Signals
- What is working well in their current approach
- Moments of delight or surprise mentioned in the session

### Pain Points and Friction
- Specific frustrations, quoted directly where possible
- Workarounds they have invented — strong signal of unmet need
- Frequency and severity rating for each pain point (1-5)

### Opportunity Signals
- Unmet needs no current solution addresses
- "If only..." or "I wish..." statements
- Behaviors that suggest latent demand

### Working Backwards Check
- Based on this interview, could you write a press release for a product that solves what was described?
- If yes: what is the headline and the core customer benefit?

### Action Items
- Hypotheses confirmed, challenged, or newly surfaced
- Features or product directions to explore
- Follow-up questions for the next interview
- Suggested additions to the Opportunity Solution Tree
</script>

<script type="text/markdown" id="md-metrics">
# PM Product Metrics

> **What it does:** Designs a product metrics framework or builds an Opportunity Solution Tree to connect a team's work to a desired outcome.
> **Input:** Mode (dashboard or ost), plus the product, product area, or outcome to focus on.
> **Output:** A layered metrics system with North Star, input, and health metrics (dashboard mode), or a full OST with opportunities, solutions, and prioritized experiments (ost mode).

---

## Frameworks Used

- **North Star Framework** — one metric that captures the core value delivered; all team OKRs should show a causal link to it
- **HEART Framework** (Google) — Happiness, Engagement, Adoption, Retention, Task Success; use for UX-centric products where revenue metrics alone miss the picture
- **Opportunity-Solution Tree** (Teresa Torres) — maps desired outcome to customer opportunities to solutions to experiments; prevents building solutions without connected customer needs
- **Continuous Discovery Habits** (Torres) — OSTs are living documents updated weekly as customer interviews surface new opportunities
- **OKR Alignment** — North Star is persistent (changes every 2-5 years); OKRs implement strategy quarterly; both must coexist without conflicting

In 2026, AI PMs use AI agents to continuously monitor whether actions are moving the North Star — replacing manual weekly metric reviews with real-time anomaly detection and automated insight surfacing.

---

## Input

$ARGUMENTS should specify:
- **Mode**: dashboard (metrics framework) or ost (opportunity solution tree)
- The product, product area, or specific outcome to focus on

If mode is unclear, infer from context: if an outcome or goal is described, default to OST; if measurement or tracking is the goal, default to dashboard.

---

## Dashboard Mode

Design a layered metrics system:

### North Star Metric
The single metric that best captures the value delivered to customers and predicts long-term business health.

A strong North Star is:
- **Customer-centric**: reflects value to the user, not just to the business
- **Leading indicator**: predicts future retention and growth
- **Actionable**: teams can directly influence it
- **Persistent**: rarely changes (Spotify: hours listened; Slack: messages sent; Airbnb: nights booked)

Include: definition, current baseline (if known), target, and why this metric over alternatives.

### Input Metrics (3-5)
Leading indicators that drive the North Star — the levers teams can pull.

### Health Metrics (3-5)
Guardrail metrics — things that must not degrade while optimizing for the North Star.

Apply HEART where relevant: Happiness (NPS, CSAT), Engagement (DAU/MAU), Adoption (new user activation), Retention (30/60/90-day), Task Success (completion rate, error rate).

Define alert thresholds for each: "If [metric] drops below [X], investigate before shipping."

---

## OST Mode

Build an Opportunity Solution Tree to connect a desired outcome to concrete experiments:

### Desired Outcome
State the product outcome the team owns — an impact, not an output:
- Good: "Increase weekly active usage among free-tier users by 20%"
- Bad: "Ship the new onboarding flow"

### Opportunities (4-6)
Each opportunity is an unmet customer need, pain point, or desire surfaced through research. Rate each on evidence strength, frequency, and severity (1-5).

### Solutions (2-3 per top opportunity)
Generate distinct solutions — avoid converging on one answer. For each:
- One-line description of the approach
- Riskiest assumption behind it
- Effort estimate (S/M/L)

### Experiments (1-2 per solution)
Design the smallest test that validates or invalidates the riskiest assumption:
- Hypothesis, test type, success metric, timeline
- Prefer tests that could prove you wrong cheaply

Recommend which branch to pursue first and why — based on opportunity evidence strength x solution confidence x experiment cost.
</script>

// Track current state
let currentSkill = 'competitor';
let currentTab = 'skill';

function selectSkill(el) {

  el.classList.add('active');
  currentSkill = el.dataset.skill;
  render(currentSkill, 'skill');
}

function switchTab(tab) {
  currentTab = tab;
  render(currentSkill, tab);
}

function render(key, tab) {
  const s = skills[key];
  currentTab = tab;

  const tabs = `
    <div class="content-tabs">
      <button class="ct ${tab==='skill'?'active':''}" onclick="switchTab('skill')">SKILL.md</button>
      <button class="ct ${tab==='input'?'active':''}" onclick="switchTab('input')">Input</button>
      <button class="ct ${tab==='output'?'active':''}" onclick="switchTab('output')">Output</button>
    </div>
  `;

  let body = '';
  if (tab === 'skill') {
    body = `<div class="md-body">${renderMd(skillmd[key])}</div>`;
  } else if (tab === 'input') {
    body = `
      <div class="example-header">example input &nbsp;·&nbsp; <a href="${s.url}" target="_blank">${s.company} ↗</a></div>

// ── Markdown renderer ──────────────────────────────────────────────

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function inlineMd(s) {
  s = escHtml(s);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`(.+?)`/g, '<code class="md-code">$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  return s;
}

function renderMd(text) {
  const lines = text.split('\n');
  let html = '';
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();

    // Fenced code block
    if (trimmed.startsWith('```')) {
      let code = '';
      i++;
      while (i < lines.length && !lines[i].trim().startsWith('```')) {
        code += escHtml(lines[i]) + '\n';
        i++;
      }
      html += `<pre class="md-pre"><code>${code}</code></pre>`;
      i++;
      continue;
    }

    // Table: check if current line starts with |
    if (trimmed.startsWith('|')) {
      let rows = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        rows.push(lines[i].trim());
        i++;
      }
      // Parse rows: skip separator rows
      let thead = '';
      let tbody = '';
      let headDone = false;
      for (const row of rows) {
        // Separator row: |---|---| pattern
        if (row.replace(/\|/g,'').replace(/-/g,'').replace(/:/g,'').replace(/\s/g,'') === '') {
          headDone = true;
          continue;
        }
        const cells = row.split('|').slice(1,-1); // remove first and last empty
        if (!headDone) {
          thead += '<tr>' + cells.map(c => `<th>${inlineMd(c.trim())}</th>`).join('') + '</tr>';
        } else {
          tbody += '<tr>' + cells.map(c => `<td>${inlineMd(c.trim())}</td>`).join('') + '</tr>';
        }
      }
      html += `<table class="md-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
      continue;
    }

    // Headings
    if (trimmed.startsWith('### ')) {
      html += `<h3 class="md-h3">${inlineMd(trimmed.slice(4))}</h3>`;
      i++; continue;
    }
    if (trimmed.startsWith('## ')) {
      html += `<h2 class="md-h2">${inlineMd(trimmed.slice(3))}</h2>`;
      i++; continue;
    }
    if (trimmed.startsWith('# ')) {
      // Skip h1 headings — the skill title is already shown above the tabs.
      i++; continue;
    }

    // Horizontal rule
    if (trimmed === '---' || trimmed === '***' || trimmed === '___') {
      html += '<hr class="md-hr">';
      i++; continue;
    }

    // Blockquote (group consecutive > lines)
    if (trimmed.startsWith('> ')) {
      html += '<blockquote class="md-bq">';
      while (i < lines.length && lines[i].trim().startsWith('> ')) {
        html += `<p>${inlineMd(lines[i].trim().slice(2))}</p>`;
        i++;
      }
      html += '</blockquote>';
      continue;
    }

    // Unordered list
    if (trimmed.match(/^[-*] /)) {
      html += '<ul class="md-ul">';
      while (i < lines.length && lines[i].trim().match(/^[-*] /)) {
        html += `<li>${inlineMd(lines[i].trim().slice(2))}</li>`;
        i++;
      }
      html += '</ul>';
      continue;
    }

    // Ordered list
    if (trimmed.match(/^\d+\. /)) {
      html += '<ol class="md-ol">';
      while (i < lines.length && lines[i].trim().match(/^\d+\. /)) {
        html += `<li>${inlineMd(lines[i].trim().replace(/^\d+\.\s+/,''))}</li>`;
        i++;
      }
      html += '</ol>';
      continue;
    }

    // Blank line
    if (trimmed === '') {
      i++; continue;
    }

    // Paragraph: accumulate until blank line or block element
    let para = '';
    while (i < lines.length) {
      const t = lines[i].trim();
      if (t === '') break;
      if (t.startsWith('#') || t.startsWith('|') || t.startsWith('>') ||
          t.match(/^[-*] /) || t.match(/^\d+\. /) || t.startsWith('```') ||
          t === '---' || t === '***') break;
      para += inlineMd(t) + ' ';
      i++;
    }
    if (para.trim()) html += `<p class="md-p">${para.trim()}</p>`;
  }

  return html;
}

// ── Copy prompt ────────────────────────────────────────────────────

function copyPrompt(text) {
  navigator.clipboard.writeText(text).then(() => {
    const b = document.getElementById('copybtn');
    b.textContent = 'copied ✓';
    b.classList.add('copied');
    setTimeout(() => { b.textContent = 'copy prompt'; b.classList.remove('copied'); }, 1800);
  });
}

function copySkill() {
  const text = skillmd[currentSkill];
  navigator.clipboard.writeText(text).then(() => {
    const b = document.getElementById('skillbtn');
    b.textContent = 'copied ✓';
    b.classList.add('copied');
    setTimeout(() => { b.textContent = 'copy SKILL.md'; b.classList.remove('copied'); }, 1800);
  });
}

render('competitor', 'skill');
</script>
