<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pm skills</title>
<style>
  :root {
    --bg: #FAFAF5;
    --sidebar-bg: #F2F1EB;
    --border: #E5E4DC;
    --selected: #FFF9C4;
    --selected-border: #F5C842;
    --text: #1C1C1E;
    --muted: #6E6E73;
    --accent: #F5A623;
    --code-bg: #EDECE6;
    --mono: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--sidebar-bg);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  header a {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.01em;
  }
  header a:hover { color: var(--text); }

  /* ── Main layout ── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--sidebar-bg);
    overflow-y: auto;
    padding: 8px 0;
  }

  .sidebar-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 8px 16px 6px;
  }

  .skill-item {
    display: flex;
    flex-direction: column;
    padding: 9px 16px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.1s;
  }

  .skill-item:hover { background: rgba(0,0,0,0.04); }

  .skill-item.active {
    background: var(--selected);
    border-left-color: var(--selected-border);
  }

  .skill-item .skill-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
  }

  .skill-item .skill-company {
    font-size: 11px;
    color: var(--muted);
  }

  /* ── Content ── */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 36px 48px;
    max-width: 780px;
  }

  .content-inner { max-width: 640px; }

  .skill-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
    line-height: 1.2;
  }

  .skill-tagline {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .io-row {
    display: flex;
    gap: 8px;
    align-items: baseline;
    margin-bottom: 6px;
    font-size: 13px;
    line-height: 1.5;
  }

  .io-label {
    font-weight: 600;
    color: var(--muted);
    width: 30px;
    flex-shrink: 0;
    font-size: 12px;
  }

  .io-value { color: var(--text); }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  /* Example block */
  .example-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .example-tag {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
  }

  .company-badge {
    font-size: 11px;
    font-weight: 500;
    background: var(--code-bg);
    color: var(--text);
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .input-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }

  .input-block .block-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .input-block p {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--text);
  }

  .output-block {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .output-block .output-header {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--code-bg);
  }

  .output-body {
    padding: 14px;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--text);
  }

  .output-body p { margin-bottom: 8px; }
  .output-body p:last-child { margin-bottom: 0; }

  .output-body strong { font-weight: 600; }

  .output-body .tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 1px 6px;
    border-radius: 3px;
    margin-right: 4px;
  }

  .tag.quick-win { background: #D4EDDA; color: #1A6B2F; }
  .tag.big-bet   { background: #FFF3CD; color: #7B5B00; }
  .tag.cut       { background: #F8D7DA; color: #7B1C24; }
  .tag.high      { background: #F8D7DA; color: #7B1C24; }
  .tag.medium    { background: #FFF3CD; color: #7B5B00; }
  .tag.low       { background: #E9ECEF; color: #495057; }

  .output-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-top: 4px;
  }

  .output-table th {
    text-align: left;
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    padding: 4px 8px 6px 0;
    border-bottom: 1px solid var(--border);
  }

  .output-table td {
    padding: 5px 8px 5px 0;
    vertical-align: top;
    border-bottom: 1px solid var(--border);
    line-height: 1.4;
  }

  .output-table tr:last-child td { border-bottom: none; }

  /* Actions */
  .actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
  }

  .btn-copy {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background 0.1s;
  }

  .btn-copy:hover { background: var(--border); }
  .btn-copy.copied { color: #1A6B2F; border-color: #A8D5B5; background: #D4EDDA; }

  .link-skill {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
  }
  .link-skill:hover { color: var(--text); text-decoration: underline; }

  /* Mobile */
  @media (max-width: 640px) {
    body { overflow: auto; }
    .layout { flex-direction: column; overflow: visible; }
    .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; padding: 6px; gap: 4px; }
    .sidebar-label { display: none; }
    .skill-item { flex-direction: row; gap: 6px; align-items: center; border-left: none; border-radius: 5px; padding: 6px 10px; }
    .skill-item.active { border-left: none; border: 1px solid var(--selected-border); }
    .skill-item .skill-company { display: none; }
    .content { padding: 24px 20px; overflow: visible; }
  }
</style>
</head>
<body>

<header>
  <h1>pm skills</h1>
  <a href="https://github.com/03shraddha/pm-skills" target="_blank">github →</a>
</header>

<div class="layout">

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-label">6 skills</div>
    <div class="skill-item active" data-skill="competitor" onclick="select(this)">
      <span class="skill-name">competitor analysis</span>
      <span class="skill-company">Sarvam AI</span>
    </div>
    <div class="skill-item" data-skill="brainstorm" onclick="select(this)">
      <span class="skill-name">pm brainstorm</span>
      <span class="skill-company">Ringg AI</span>
    </div>
    <div class="skill-item" data-skill="assumptions" onclick="select(this)">
      <span class="skill-name">assumption mapping</span>
      <span class="skill-company">Emergent</span>
    </div>
    <div class="skill-item" data-skill="features" onclick="select(this)">
      <span class="skill-name">feature prioritization</span>
      <span class="skill-company">Portkey</span>
    </div>
    <div class="skill-item" data-skill="research" onclick="select(this)">
      <span class="skill-name">customer research</span>
      <span class="skill-company">Arintra</span>
    </div>
    <div class="skill-item" data-skill="metrics" onclick="select(this)">
      <span class="skill-name">product metrics</span>
      <span class="skill-company">WizCommerce</span>
    </div>
  </nav>

  <!-- Content -->
  <main class="content" id="content"></main>

</div>

<script>
const skills = {

  competitor: {
    name: "competitor analysis",
    tagline: "maps 5 direct competitors — moats, gaps, pricing, and positioning — then delivers a north star differentiation thesis with battlecard-ready output.",
    io: {
      in: "product or company name + optional market segment",
      out: "competitor profiles, moat analysis, differentiation opportunities, battlecard-ready positioning"
    },
    company: "Sarvam AI",
    prompt: "/competitor-analysis Sarvam AI, Indian sovereign language model market",
    skillFile: "competitor-analysis/SKILL.md",
    inputText: `Sarvam AI — Indian sovereign language model company.\nBuilds voice + text AI for 11 Indian languages.\nProducts: Sarvam APIs (TTS, STT, translation), Indus chat app.\nTarget: enterprises building India-first AI products.`,
    output: `<p><strong>Market:</strong> Indian sovereign AI — voice + language models for regional markets. Growing rapidly as enterprises face DPDP compliance pressure and demand for culturally relevant AI.</p>
<p><strong>Competitors identified:</strong></p>
<table class="output-table">
  <thead><tr><th>Company</th><th>Position</th><th>Key moat</th></tr></thead>
  <tbody>
    <tr><td><strong>Krutrim (Ola)</strong></td><td>Consumer + enterprise</td><td>Ola's distribution, infra investment</td></tr>
    <tr><td><strong>CoRover.ai</strong></td><td>Govt + BFSI</td><td>Deep govt relationships, BharatGPT</td></tr>
    <tr><td><strong>Bhashini (NPCI/Govt)</strong></td><td>Infra layer</td><td>State-backed, free to use</td></tr>
    <tr><td><strong>Gnani.ai</strong></td><td>Voice AI, enterprise</td><td>Strong in BFSI call centres</td></tr>
    <tr><td><strong>OpenAI (India push)</strong></td><td>Global incumbent</td><td>Model quality, developer mindshare</td></tr>
  </tbody>
</table>
<p><strong>Differentiation opportunity:</strong> No player credibly owns enterprise voice APIs with DPDP compliance + on-premise deployment. Sarvam is best positioned to claim "sovereign AI infra" before hyperscalers localise.</p>
<p><strong>North star thesis:</strong> Position as the only API-first sovereign AI that enterprises can deploy within India's data borders — not a chatbot company, an AI infrastructure company.</p>`
  },

  brainstorm: {
    name: "pm brainstorm",
    tagline: "generates product ideas from PM, designer, and engineer perspectives — or designs lean experiments to test them. works for existing products and new concepts.",
    io: {
      in: "product name + mode (ideas or experiments) + stage (existing or new)",
      out: "ranked idea list or experiment designs with hypothesis and success metrics"
    },
    company: "Ringg AI",
    prompt: "/pm-brainstorm Ringg AI, mode: ideas, existing product",
    skillFile: "pm-brainstorm/SKILL.md",
    inputText: `Ringg AI — AI voice calling agent.\nMode: ideas (brainstorm new features).\nStage: existing product.\nCore product: automated inbound/outbound calling with 20+ language support, visual flow builder, CRM integrations.`,
    output: `<p><strong>PM lens</strong> — jobs-to-be-done the product currently leaves unfinished:</p>
<p>1. <strong>Outbound campaign scheduler</strong> — teams want to run timed bulk campaigns (e.g. payment reminders day 1, 3, 7) without manual triggers. High frequency pain.<br>
2. <strong>Lead scoring from call signals</strong> — surface intent signals from transcripts (hesitation, pricing questions) directly into CRM.<br>
3. <strong>Multi-agent parallel dialling</strong> — run 50 calls simultaneously for high-volume collections or appointment confirmations.</p>
<p><strong>Designer lens</strong> — friction and delight gaps:</p>
<p>4. <strong>Live call monitoring dashboard</strong> — supervisors want to see in-progress calls, whisper coaching, and sentiment in real time.<br>
5. <strong>Script A/B testing UI</strong> — compare two call scripts side by side with conversion metrics. Currently requires engineering.</p>
<p><strong>Engineer lens</strong> — underutilised capabilities:</p>
<p>6. <strong>Webhook library for 1-click CRM sync</strong> — Salesforce, HubSpot, Zoho. Reduces integration time from days to minutes.<br>
7. <strong>Call outcome API</strong> — let customers programmatically read dispositions, transcripts, and next steps into their own systems.</p>
<p><strong>Top 3 by impact/effort:</strong></p>
<table class="output-table">
  <thead><tr><th>Idea</th><th>Impact</th><th>Effort</th><th>Verdict</th></tr></thead>
  <tbody>
    <tr><td>Webhook CRM library</td><td>High</td><td>Low</td><td><span class="tag quick-win">Quick win</span></td></tr>
    <tr><td>Live monitoring dashboard</td><td>High</td><td>Medium</td><td><span class="tag quick-win">Quick win</span></td></tr>
    <tr><td>Campaign scheduler</td><td>High</td><td>High</td><td><span class="tag big-bet">Big bet</span></td></tr>
  </tbody>
</table>`
  },

  assumptions: {
    name: "assumption mapping",
    tagline: "surfaces and prioritizes the riskiest assumptions behind any feature or product idea before you build. uses VUVF for existing products, 8 risk categories for new ones.",
    io: {
      in: "feature or product idea + stage (existing or new)",
      out: "full assumption map by category, top 5-7 by impact × evidence, one experiment each"
    },
    company: "Emergent",
    prompt: "/pm-assumption-mapping Emergent, 'build full-stack app from text description', new product",
    skillFile: "pm-assumption-mapping/SKILL.md",
    inputText: `Emergent — AI app builder.\nCore bet: non-technical founders can describe an app in plain English and get a deployable full-stack product (web + mobile) with no coding.\n6M+ apps built, 5M+ users, YC-backed.`,
    output: `<p><strong>Top 5 assumptions by priority</strong> (high impact × low evidence first):</p>
<table class="output-table">
  <thead><tr><th>#</th><th>Assumption</th><th>Category</th><th>Impact</th><th>Evidence</th><th>Test</th></tr></thead>
  <tbody>
    <tr>
      <td>1</td>
      <td>Non-technical users can articulate requirements clearly enough for AI to build correctly on first pass</td>
      <td>Usability</td>
      <td><span class="tag high">5</span></td>
      <td><span class="tag low">1</span></td>
      <td>Recruit 10 non-technical founders — measure % satisfied with first-gen output</td>
    </tr>
    <tr>
      <td>2</td>
      <td>AI-generated code meets production quality for customer-facing apps</td>
      <td>Value</td>
      <td><span class="tag high">5</span></td>
      <td><span class="tag low">2</span></td>
      <td>Audit 20 deployed apps for security, performance, and error rate</td>
    </tr>
    <tr>
      <td>3</td>
      <td>Users trust deploying code they haven't reviewed to real customers</td>
      <td>Desirability</td>
      <td><span class="tag high">4</span></td>
      <td><span class="tag low">1</span></td>
      <td>Survey 100 users: did you review the code before going live?</td>
    </tr>
    <tr>
      <td>4</td>
      <td>We can acquire enough non-technical users at viable CAC</td>
      <td>Go-to-Market</td>
      <td><span class="tag high">4</span></td>
      <td><span class="tag medium">3</span></td>
      <td>Measure CAC by channel for 90 days</td>
    </tr>
    <tr>
      <td>5</td>
      <td>The "idea to app" flow scales beyond simple CRUD apps</td>
      <td>Feasibility</td>
      <td><span class="tag high">4</span></td>
      <td><span class="tag low">2</span></td>
      <td>Test 15 complex app descriptions — measure % fully functional without manual fixes</td>
    </tr>
  </tbody>
</table>
<p><strong>Leap-of-faith:</strong> Assumption #1. If non-technical users can't describe requirements well enough, the whole product thesis breaks — no amount of better AI fixes a requirements problem.</p>`
  },

  features: {
    name: "feature prioritization",
    tagline: "scores and segments a backlog into what to ship, bet on, or cut. groups by theme, applies RICE scoring, and surfaces an explicit do-not-build list.",
    io: {
      in: "list of feature requests or backlog items + optional OKRs and team capacity",
      out: "RICE-scored backlog, quick wins / big bets matrix, top 3 recommendations, do-not-build list"
    },
    company: "Portkey",
    prompt: "/pm-feature-prioritization Portkey LLM gateway, [6 feature requests below]",
    skillFile: "pm-feature-prioritization/SKILL.md",
    inputText: `Portkey — enterprise LLM gateway. Routes requests across 1600+ models.\nIncoming feature requests:\n1. Semantic caching v2 (smarter similarity thresholds)\n2. Multi-tenant billing dashboard\n3. Prompt versioning + rollback\n4. Visual prompt editor (GUI)\n5. Slack alert integration\n6. SOC2 compliance report export`,
    output: `<p><strong>RICE scores:</strong></p>
<table class="output-table">
  <thead><tr><th>Feature</th><th>Reach</th><th>Impact</th><th>Conf</th><th>Effort</th><th>Score</th><th>Verdict</th></tr></thead>
  <tbody>
    <tr><td>SOC2 report export</td><td>500 enterprise</td><td>2</td><td>90%</td><td>2w</td><td><strong>45</strong></td><td><span class="tag quick-win">Quick win</span></td></tr>
    <tr><td>Slack alert integration</td><td>800 teams</td><td>1</td><td>85%</td><td>1w</td><td><strong>34</strong></td><td><span class="tag quick-win">Quick win</span></td></tr>
    <tr><td>Multi-tenant billing</td><td>200 enterprise</td><td>3</td><td>70%</td><td>8w</td><td><strong>26</strong></td><td><span class="tag big-bet">Big bet</span></td></tr>
    <tr><td>Prompt versioning</td><td>600 teams</td><td>1</td><td>80%</td><td>3w</td><td><strong>16</strong></td><td>Fill-in</td></tr>
    <tr><td>Semantic caching v2</td><td>400 teams</td><td>2</td><td>60%</td><td>6w</td><td><strong>8</strong></td><td><span class="tag big-bet">Validate first</span></td></tr>
    <tr><td>Visual prompt editor</td><td>300 users</td><td>1</td><td>50%</td><td>10w</td><td><strong>1.5</strong></td><td><span class="tag cut">Cut</span></td></tr>
  </tbody>
</table>
<p><strong>Do not build:</strong> Visual prompt editor. Portkey's users are API-first engineers. A GUI contradicts the product's positioning and would attract the wrong segment. Validated by low confidence score and high effort.</p>
<p><strong>Top 3 this sprint:</strong> SOC2 export (enterprise compliance unlock), Slack alerts (retention play, 1 week), then scope multi-tenant billing discovery with 5 enterprise accounts before committing 8 weeks.</p>`
  },

  research: {
    name: "customer research",
    tagline: "writes JTBD-grounded interview scripts or synthesizes transcripts into structured insight summaries with pain points, opportunity signals, and action items.",
    io: {
      in: "mode (script or summarize) + product area/hypothesis or transcript",
      out: "interview guide with JTBD questions, or insight summary with pain points and opportunities"
    },
    company: "Arintra",
    prompt: "/pm-customer-research script, hospital billing managers, Arintra medical coding AI",
    skillFile: "pm-customer-research/SKILL.md",
    inputText: `Arintra — autonomous medical coding AI.\nConverts patient charts to insurance claims at 96% accuracy.\nTarget: hospital billing managers in ambulatory, emergency, and inpatient settings.\nGoal: understand how billing managers experience the coding process today before pitching AI automation.`,
    output: `<p><strong>Interview script (45 min) — hospital billing manager</strong></p>
<p><strong>Warm-up (5 min)</strong><br>
"Walk me through your role — who do you interact with most on a typical day?"<br>
"How does a patient chart get from the doctor to your team?"</p>
<p><strong>Current behavior (15 min)</strong><br>
"Walk me through the last time a claim was denied. What happened from the moment you realised it?"<br>
"What does your day look like during peak volume — end of month, audits?"<br>
"What workarounds or checklists has your team built to catch errors before submission?"</p>
<p><strong>JTBD deep dive (15 min)</strong><br>
"What would change for you personally if your denial rate dropped to near zero?"<br>
"How is your team's performance measured — and what keeps you up at night about hitting those numbers?"<br>
"If coding errors just disappeared, what would you do with that time?"<br>
"How do physicians on your floor perceive the billing team — and does that affect how you work?"</p>
<p><strong>Solution probe — optional (5 min)</strong><br>
"Arintra claims 96% autonomous coding accuracy. Before trusting that number, what three questions would you need answered?"<br>
"What would a failed implementation look like for you — what's the nightmare scenario?"</p>
<p><strong>Wrap-up (5 min)</strong><br>
"Anything I didn't ask that you think I should know?"<br>
"Who else on your team or network would give me a completely different perspective on this?"</p>`
  },

  metrics: {
    name: "product metrics",
    tagline: "designs a layered metrics dashboard (north star + input + health) or builds an opportunity solution tree to connect a desired outcome to experiments.",
    io: {
      in: "mode (dashboard or ost) + product area or desired outcome",
      out: "north star + input + health metrics system, or full OST with opportunities, solutions, and experiments"
    },
    company: "WizCommerce",
    prompt: "/pm-product-metrics WizCommerce, mode: dashboard",
    skillFile: "pm-product-metrics/SKILL.md",
    inputText: `WizCommerce — AI operating system for wholesale B2B commerce.\nProducts: WizShop (buyer portal), WizOrder (sales rep app), WizStudio (AI imagery), WizPay (payments).\nCore AI feature: Order Entry Assistant processes POs from email/PDF with zero manual data entry.\nMode: dashboard (design metrics framework).`,
    output: `<p><strong>North Star Metric:</strong> GMV processed through AI-assisted orders per month</p>
<p><em>Why this:</em> It's customer-centric (captures real order flow), predicts long-term retention, and is directly influenced by product investment. Tracks both adoption and business value in one number.</p>
<p><strong>Input metrics</strong> (levers the team can pull):</p>
<table class="output-table">
  <thead><tr><th>Metric</th><th>Definition</th><th>Target direction</th></tr></thead>
  <tbody>
    <tr><td>AI order entry adoption rate</td><td>% of orders initiated via AI vs manual data entry</td><td>↑</td></tr>
    <tr><td>Avg time-to-order-confirmation</td><td>Minutes from PO upload to confirmed order</td><td>↓</td></tr>
    <tr><td>Zero-edit order rate</td><td>% of AI-processed orders requiring no manual corrections</td><td>↑</td></tr>
    <tr><td>Buyer repeat order rate</td><td>% of buyers placing a second order within 30 days</td><td>↑</td></tr>
  </tbody>
</table>
<p><strong>Health metrics</strong> (guardrails — must not degrade):</p>
<table class="output-table">
  <thead><tr><th>Metric</th><th>HEART dimension</th><th>Alert threshold</th></tr></thead>
  <tbody>
    <tr><td>Order error rate</td><td>Task Success</td><td>Alert if &gt; 3%</td></tr>
    <tr><td>ERP sync failure rate</td><td>Task Success</td><td>Alert if &gt; 2% — pause AI features</td></tr>
    <tr><td>Buyer NPS</td><td>Happiness</td><td>Alert if &lt; 35</td></tr>
    <tr><td>Monthly active buyers / account</td><td>Retention</td><td>Alert if drops &gt; 10% MoM</td></tr>
  </tbody>
</table>`
  }

};

function select(el) {
  document.querySelectorAll('.skill-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  render(el.dataset.skill);
}

function render(key) {
  const s = skills[key];
  const ghBase = "https://github.com/03shraddha/pm-skills/blob/main/";

  document.getElementById('content').innerHTML = `
    <div class="content-inner">
      <h2 class="skill-title">${s.name}</h2>
      <p class="skill-tagline">${s.tagline}</p>

      <div class="section-label">what you give it</div>
      <div class="io-row"><span class="io-label">in</span><span class="io-value">${s.io.in}</span></div>
      <div class="io-row"><span class="io-label">out</span><span class="io-value">${s.io.out}</span></div>

      <hr class="divider">

      <div class="example-header">
        <span class="example-tag">example</span>
        <span class="company-badge">${s.company}</span>
      </div>

      <div class="input-block">
        <div class="block-label">input</div>
        <p>${s.inputText.replace(/\n/g, '<br>')}</p>
      </div>

      <div class="output-block">
        <div class="output-header">output (abbreviated)</div>
        <div class="output-body">${s.output}</div>
      </div>

      <div class="actions">
        <button class="btn-copy" id="copybtn" onclick="copyPrompt('${s.prompt.replace(/'/g, "\\'")}')">copy prompt</button>
        <a class="link-skill" href="${ghBase}${s.skillFile}" target="_blank">view SKILL.md →</a>
      </div>
    </div>
  `;
}

function copyPrompt(text) {
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copybtn');
    btn.textContent = 'copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'copy prompt';
      btn.classList.remove('copied');
    }, 1800);
  });
}

// Initial render
render('competitor');
</script>
</body>
</html>
